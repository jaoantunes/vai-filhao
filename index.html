<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#05060f">
  <title>Vai Filhão</title>
  <!-- Prévia ao compartilhar o link (WhatsApp, redes sociais): a imagem precisa de endereço completo -->
  <meta name="description" content="Este foguete não tem ré, cara.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vai Filhão">
  <meta property="og:title" content="Vai Filhão">
  <meta property="og:description" content="Este foguete não tem ré, cara.">
  <meta property="og:url" content="https://jaoantunes.github.io/vai-filhao/">
  <meta property="og:image" content="https://jaoantunes.github.io/vai-filhao/thumb.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Tela título do Vai Filhão: a nave no pad com a Terra ao fundo">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root { --bg: #05060f; --fg: #e8ecff; --accent: #ffb82e; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--fg); overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      /* sem rolagem, zoom ou menu de toque longo sobre o jogo */
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* 100dvh acompanha a barra de endereço do celular aparecendo/sumindo */
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: var(--bg); outline: none; }

    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px; background: var(--bg);
      transition: opacity .4s;
    }
    #loading h1 { margin: 0; font-size: clamp(28px, 7vw, 64px); letter-spacing: .06em; }
    #bar { width: min(70vw, 420px); height: 10px; border-radius: 5px; background: #1b1f3a; overflow: hidden; }
    #bar-fill { width: 0; height: 100%; background: var(--accent); transition: width .2s; }
    #loading p { margin: 0; opacity: .7; font-size: 14px; }

    #fullscreen {
      /* no topo, ao centro: o HUD usa os cantos de cima e os controles de toque usam os de baixo */
      position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      width: 36px; height: 36px; border: 0; border-radius: 8px; cursor: pointer;
      background: rgba(255,255,255,.12); color: var(--fg); font-size: 18px; line-height: 36px;
      opacity: .45; transition: opacity .2s, background .2s;
      display: none;
    }
    #fullscreen:hover, #fullscreen:focus-visible { opacity: 1; background: rgba(255,255,255,.25); }

    /* aviso para girar o aparelho (só em telas de toque em pé) */
    #rotate {
      position: absolute; inset: 0; display: none; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
      background: var(--bg); z-index: 10;
    }
    #rotate .icon { font-size: 64px; animation: turn 1.6s ease-in-out infinite; }
    @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }

    #error { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
      max-width: 90vw; padding: 10px 16px; border-radius: 8px; background: #a32020; display: none; }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>Vai Filhão</h1>
      <div id="bar"><div id="bar-fill"></div></div>
      <p id="loading-text">Carregando…</p>
    </div>
    <button id="fullscreen" title="Tela cheia" aria-label="Tela cheia">⛶</button>
    <div id="rotate">
      <div class="icon">📱</div>
      <div>Gire o aparelho para jogar na horizontal</div>
    </div>
    <div id="error"></div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#loading");
    var barFill = document.querySelector("#bar-fill");
    var loadingText = document.querySelector("#loading-text");
    var fsButton = document.querySelector("#fullscreen");
    var errorBox = document.querySelector("#error");
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                   (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));

    function showError(msg) { errorBox.textContent = msg; errorBox.style.display = "block"; }

    var config = {
      arguments: [],
      dataUrl: "Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "@antunesketch",
      productName: "Vai Filhão",
      productVersion: "2.5",
      // Limita a resolução em telas de alta densidade (celular) para manter o FPS
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2),
      matchWebGLToCanvasSize: true,
      autoSyncPersistentDataPath: true,
      showBanner: function (msg, type) { if (type === "error") showError(msg); else console.warn(msg); },
    };

    var script = document.createElement("script");
    script.src = "Build/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        barFill.style.width = Math.round(progress * 100) + "%";
        loadingText.textContent = "Carregando… " + Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        loading.style.opacity = "0";
        setTimeout(function () { loading.style.display = "none"; }, 400);
        // Tela cheia no container (mantém o aviso de girar por cima); iPhone não suporta e o botão some
        var game = document.querySelector("#game");
        var requestFs = game.requestFullscreen || game.webkitRequestFullscreen;
        if (requestFs) {
          fsButton.style.display = "block";
          fsButton.onclick = function () {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
              (document.exitFullscreen || document.webkitExitFullscreen).call(document);
              return;
            }
            Promise.resolve(requestFs.call(game)).then(function () {
              // no celular, tenta travar na horizontal ao entrar em tela cheia
              if (screen.orientation && screen.orientation.lock) return screen.orientation.lock("landscape");
            }).catch(function () {});
          };
        }
        canvas.focus();
      }).catch(function (message) { showError(message); });
    };
    script.onerror = function () { showError("Não foi possível carregar o jogo."); };
    document.body.appendChild(script);
  </script>
</body>
</html>
